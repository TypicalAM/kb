name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: DRC
        run: nix shell nixpkgs#kicad -c kicad-cli pcb drc --severity-all --exit-code-violations -o drc.rpt diag.kicad_pcb

      - name: Gerbers and drill files
        run: |
          mkdir -p out
          nix shell nixpkgs#kicad -c sh -c '
            kicad-cli pcb export gerbers -o out/ --board-plot-params diag.kicad_pcb &&
            kicad-cli pcb export drill -o out/ --format excellon --excellon-separate-th --drill-origin absolute --excellon-units mm diag.kicad_pcb'
          (cd out && zip -q ../diag_gerbers.zip *)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Gerbers and drill files for PCBWay (generated from diag.kicad_pcb)" --target "$GITHUB_SHA"
          gh release upload "$TAG" diag_gerbers.zip --clobber
